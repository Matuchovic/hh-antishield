name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Jádro (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formát
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p antishield-core -p antishield-cli --all-targets --features antishield-cli/signing -- -D warnings
      - name: Testy
        shell: bash
        run: |
          set -o pipefail
          cargo test -p antishield-core -p antishield-cli --features antishield-cli/signing 2>&1 | tee test-output.txt
      - name: Souhrn selhaných testů
        if: failure()
        shell: bash
        # Logy nejsou vždy dostupné; selhání posíláme i jako anotace.
        run: |
          [ -f test-output.txt ] || exit 0
          awk '/^---- .* stdout ----$/{p=6} p>0{printf "%s%%0A", $0; p--; if(p==0) print ""}' test-output.txt \
            | head -10 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Self-test CLI
        run: cargo run -p antishield-cli -- --data-dir ${{ runner.temp }}/as-data selftest

  ui:
    name: Rozhraní
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: Aplikace (Linux, kontrola překladu)
    runs-on: ubuntu-latest
    env:
      # Jednorázové firmy pro živý test schránky (kód s víc použitími, v tajných proměnných).
      ANTISHIELD_FLEET_ACTIVATION: ${{ secrets.ANTISHIELD_FLEET_ACTIVATION }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p antishield-app --all-targets -- -D warnings
      - name: Testy aplikace (včetně firemní správy se schránkou v paměti)
        run: cargo test -p antishield-app
      - name: Firemní správa proti živé schránce
        if: env.ANTISHIELD_FLEET_ACTIVATION != ''
        run: cargo test -p antishield-app live_relay -- --ignored --nocapture
      - run: cargo run -p antishield-app -- --self-test

  deny:
    name: Licence a zranitelnosti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
