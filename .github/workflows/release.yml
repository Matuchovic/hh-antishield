name: Release

# Sestaví instalační balíčky a podepsané aktualizace. Ruční spuštění se
# zaškrtnutým „publish“ (nebo značka v*) vytvoří GitHub Release v<verze>
# s latest.json, odkud si aplikace stahuje aktualizace. Vydání tedy vždy
# potvrzuje člověk.
# macOS: podpis ad-hoc (bez Apple Developer ID), Windows: nepodepsaný instalátor.
# Aktualizace podepisuje klíč updateru z GitHub Secrets (TAURI_SIGNING_*).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Vydat jako GitHub Release (aplikace ho nabídne k aktualizaci)"
        type: boolean
        default: false
      notes:
        description: "Poznámky k vydání (zobrazí se v banneru)"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  check:
    name: Kontrola verze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Stejná verze podruhé vydat nejde; zastavit hned, ne až po sestavení.
      - name: Verze ještě není vydaná
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./app/package.json').version")
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Verze $VER už je vydaná. Nejdřív slučte do main PR se zvýšenou verzí, pak spusťte Release znovu."
            exit 1
          fi
          echo "Vydá se verze $VER."

  macos:
    name: macOS DMG (Apple Silicon + Intel)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Klíč pro podpis aktualizací
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Chybí GitHub Secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Sestavení
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg
        working-directory: app
      - name: Kontrola podpisu a self-test
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/H&H AntiShield.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/antishield-app"
          # Výjimka pro kód YARA-X překládaný za běhu musí být v podpisu.
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q allow-unsigned-executable-memory
          # Self-test podepsané aplikace z balíčku: běží v tvrzeném prostředí
          # jako u uživatele (samotná binárka z target/ by pád neodhalila).
          "$APP/Contents/MacOS/antishield-app" --self-test
      - name: Soubory k vydání
        run: |
          VER=$(node -p "require('./app/package.json').version")
          B=target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$B"/dmg/*.dmg "out/hh-antishield_${VER}_universal.dmg"
          cp "$B"/macos/*.app.tar.gz "out/hh-antishield_${VER}_universal.app.tar.gz"
          cp "$B"/macos/*.app.tar.gz.sig "out/hh-antishield_${VER}_universal.app.tar.gz.sig"
          cd out && shasum -a 256 *.dmg *.tar.gz | tee SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hh-antishield-macos
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows instalátor
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Klíč pro podpis aktualizací
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Chybí GitHub Secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Sestavení
        run: npm run tauri -- build --bundles nsis
        working-directory: app
      - name: Self-test enginu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target/release/antishield-app.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test selhal: $($p.ExitCode)" }
      - name: Soubory k vydání
        shell: bash
        run: |
          VER=$(node -p "require('./app/package.json').version")
          B=target/release/bundle/nsis
          mkdir -p out
          cp "$B"/*-setup.exe "out/hh-antishield_${VER}_x64-setup.exe"
          cp "$B"/*-setup.exe.sig "out/hh-antishield_${VER}_x64-setup.exe.sig"
          cd out && sha256sum *.exe | tee SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hh-antishield-windows
          path: out/*
          if-no-files-found: error

  publish:
    name: GitHub Release + latest.json
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Ověřit verzi a sestavit latest.json
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          VER=$(node -p "require('./app/package.json').version")
          TAG="v$VER"
          NOTES="$INPUT_NOTES"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$TAG"
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN/,$d')
          fi
          [ -n "$NOTES" ] || NOTES="H&H AntiShield $VER"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          printf '%s\n' "$NOTES" > notes.md
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          MAC="hh-antishield_${VER}_universal.app.tar.gz"
          WIN="hh-antishield_${VER}_x64-setup.exe"
          jq -n --arg v "$VER" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$BASE/$MAC" --arg macsig "$(cat "out/$MAC.sig")" \
            --arg win "$BASE/$WIN" --arg winsig "$(cat "out/$WIN.sig")" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "darwin-aarch64": {signature: $macsig, url: $mac},
               "darwin-x86_64": {signature: $macsig, url: $mac},
               "windows-x86_64": {signature: $winsig, url: $win}}}' > out/latest.json
          cat out/latest.json
      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
        # Existující vydání se nepřepisuje: každá verze je neměnná.
        run: gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "H&H AntiShield $TAG" --notes-file notes.md
