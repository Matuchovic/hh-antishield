name: Release

# Sestaví instalační balíčky. Spouští se ručně nebo značkou v*.
# v0.1: macOS je podepsaný ad-hoc (bez Apple Developer ID), Windows nepodepsaný.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS DMG (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Sestavení
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg
        working-directory: app
      - name: Kontrola podpisu a entitlements
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/H&H AntiShield.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP"
          lipo -archs "$APP/Contents/MacOS/antishield-app"
          "target/universal-apple-darwin/release/antishield-app" --self-test
      - name: Kontrolní součty
        run: |
          cd target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg | tee SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hh-antishield-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS-macos.txt
          if-no-files-found: error

  windows:
    name: Windows instalátor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Sestavení
        run: npm run tauri -- build --bundles nsis
        working-directory: app
      - name: Self-test enginu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target/release/antishield-app.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test selhal: $($p.ExitCode)" }
      - name: Kontrolní součty
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Tee-Object -FilePath target/release/bundle/nsis/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hh-antishield-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error
