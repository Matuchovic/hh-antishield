name: Release

# Sestaví instalační balíčky a podepsané aktualizace. Značka v* navíc vytvoří
# GitHub Release s latest.json, odkud si aplikace stahuje aktualizace.
# macOS: podpis ad-hoc (bez Apple Developer ID), Windows: nepodepsaný instalátor.
# Aktualizace podepisuje klíč updateru z GitHub Secrets (TAURI_SIGNING_*).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  macos:
    name: macOS DMG (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Sestavení
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg
        working-directory: app
      - name: Kontrola podpisu a self-test
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/H&H AntiShield.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/antishield-app"
          "target/universal-apple-darwin/release/antishield-app" --self-test
      - name: Soubory k vydání
        run: |
          VER=$(node -p "require('./app/package.json').version")
          B=target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$B"/dmg/*.dmg "out/hh-antishield_${VER}_universal.dmg"
          cp "$B"/macos/*.app.tar.gz "out/hh-antishield_${VER}_universal.app.tar.gz"
          cp "$B"/macos/*.app.tar.gz.sig "out/hh-antishield_${VER}_universal.app.tar.gz.sig"
          cd out && shasum -a 256 *.dmg *.tar.gz | tee SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hh-antishield-macos
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows instalátor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Sestavení
        run: npm run tauri -- build --bundles nsis
        working-directory: app
      - name: Self-test enginu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target/release/antishield-app.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test selhal: $($p.ExitCode)" }
      - name: Soubory k vydání
        shell: bash
        run: |
          VER=$(node -p "require('./app/package.json').version")
          B=target/release/bundle/nsis
          mkdir -p out
          cp "$B"/*-setup.exe "out/hh-antishield_${VER}_x64-setup.exe"
          cp "$B"/*-setup.exe.sig "out/hh-antishield_${VER}_x64-setup.exe.sig"
          cd out && sha256sum *.exe | tee SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hh-antishield-windows
          path: out/*
          if-no-files-found: error

  publish:
    name: GitHub Release + latest.json
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Ověřit verzi a sestavit latest.json
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          test "$VER" = "$(node -p "require('./app/package.json').version")"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN/,$d')
          [ -n "$NOTES" ] || NOTES="H&H AntiShield $VER"
          printf '%s\n' "$NOTES" > notes.md
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          MAC="hh-antishield_${VER}_universal.app.tar.gz"
          WIN="hh-antishield_${VER}_x64-setup.exe"
          jq -n --arg v "$VER" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$BASE/$MAC" --arg macsig "$(cat "out/$MAC.sig")" \
            --arg win "$BASE/$WIN" --arg winsig "$(cat "out/$WIN.sig")" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "darwin-aarch64": {signature: $macsig, url: $mac},
               "darwin-x86_64": {signature: $macsig, url: $mac},
               "windows-x86_64": {signature: $winsig, url: $win}}}' > out/latest.json
          cat out/latest.json
      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "H&H AntiShield $GITHUB_REF_NAME" --notes-file notes.md
