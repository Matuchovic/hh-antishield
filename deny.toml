# Politika závislostí H&H AntiShield. Kontroluje se v CI při každé změně.
# Nová licence nebo nový zdroj kódu = vědomé rozhodnutí v pull requestu.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # ring, rustls-webpki, untrusted (TLS pro aktualizace)
    "ISC",
    # notify (hlídání složek)
    "CC0-1.0",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[advisories]
yanked = "deny"
ignore = [
    # Nevyužívaná makra gtk-rs (glib-macros, gtk3-macros). Jen pro vývojový build
    # na Linuxu, v aplikaci pro macOS a Windows nejsou. Zranitelnost to není.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained proc macro used only by the Linux GTK stack (dev builds)" },
    # yara-x 1.21 (nejnovější) používá wasmtime 45. Opravy existují jen pro jiné
    # řady wasmtime. Chyby se týkají WASI, component modelu nebo více enginů;
    # yara-x spouští jen vlastní WASM moduly přeložené z našich podepsaných
    # pravidel, bez WASI a bez komponent. Data souborů kód nenahrávají.
    { id = "RUSTSEC-2026-0222", reason = "single wasmtime engine inside yara-x; no cross-engine stores" },
    { id = "RUSTSEC-2026-0269", reason = "WASI filesystem is not used by yara-x" },
    { id = "RUSTSEC-2026-0316", reason = "component model is not used by yara-x" },
    { id = "RUSTSEC-2026-0327", reason = "component model is not used by yara-x" },
    # rsa v yara-x jen ověřuje podpisy PE (veřejný klíč); časový útok Marvin
    # se týká dešifrování soukromým klíčem.
    { id = "RUSTSEC-2023-0071", reason = "rsa only verifies Authenticode signatures with public keys" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained but not vulnerable; used inside yara-x" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Kryptografie jen z čistého Rustu, žádné systémové OpenSSL.
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
