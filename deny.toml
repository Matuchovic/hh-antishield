# Politika závislostí H&H AntiShield. Kontroluje se v CI při každé změně.
# Nová licence nebo nový zdroj kódu = vědomé rozhodnutí v pull requestu.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[advisories]
yanked = "deny"
ignore = [
    # Nevyužívaná makra gtk-rs (glib-macros, gtk3-macros). Jen pro vývojový build
    # na Linuxu, v aplikaci pro macOS a Windows nejsou. Zranitelnost to není.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained proc macro used only by the Linux GTK stack (dev builds)" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Kryptografie jen z čistého Rustu, žádné systémové OpenSSL.
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
