[package]
name = "antishield-core"
description = "H&H AntiShield: přenositelné jádro detekce (pravidla, skener, audit, stav)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[features]
# Podepisování sad pravidel. Aplikace tuto funkci nikdy nezapíná.
signing = []

[dependencies]
aho-corasick.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
getrandom.workspace = true
data-encoding.workspace = true
zeroize.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
walkdir.workspace = true
yara-x.workspace = true
zip.workspace = true
sysinfo.workspace = true
notify.workspace = true
plist.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
zip = { workspace = true }
antishield-core = { path = ".", features = ["signing"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
