[package]
name = "antishield-cli"
description = "H&H AntiShield: vývojářský nástroj (kontrola, self-test, pravidla, audit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "antishield"
path = "src/main.rs"

[features]
# Generování klíčů a podepisování sad pravidel (jen pro správce pravidel).
signing = ["antishield-core/signing", "dep:getrandom"]

[dependencies]
antishield-core.workspace = true
clap.workspace = true
serde_json.workspace = true
hex.workspace = true
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
